version: '3.8'

services:
  banchecker-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: banchecker-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persistir sesión de WhatsApp entre reinicios
      - ./wa_session:/app/wa_session
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - TZ=America/Lima
    # Recursos (opcional, ajusta según tu servidor)
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M
    # Logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
